[pytest]
asyncio_mode = auto
# Session-scoped loops: the patchright driver belongs to the loop that started
# it, so a per-module loop forces a fresh Node driver (and its ~0.3 s spawn)
# for every module a worker touches. One loop per worker lets the driver —
# and its warm CDP connection — serve every browser the worker opens.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = ["tests/e2e"]
# addopts MUST stay unquoted: pytest shlex-splits a quoted value into a single
# argument, so `addopts = "-ra -n 4"` silently passes one bogus arg and xdist
# never starts a worker (the whole suite then runs in one process).
# Worker sweep on this 8-thread box, full suite, 157 tests, quiet-window runs
# after the dyn-asgi flake fix (ADR-0033): -n 3 80.0 s, -n 4 84.4 s,
# -n 5 84.8 s, -n 6 88.6 s. More workers never win: 3 workers already
# saturate the box's 4 physical cores, so per-test time inflates with the
# worker count (test_time_sum 220 s at -n 3 vs 476 s at -n 6) while wall time
# only grows — the suite is CPU-bound, not scheduling-bound, so the next real
# gain has to come from doing less work per test, not from more workers.
# 4+ workers also re-expose test_23's user-close race: handle_dialog's
# already-closed branch leaves the registry entry to the parked probe (ADR-0022),
# so the unblock trails the user's close by a CDP round trip. The test now polls
# to a deadline for it; browsers starved past that deadline would still flake,
# and 3 keeps a core of headroom.
# Override per invocation: `-n 0` sequential (also required for pdb — xdist
# breaks it), `-n N` more.
addopts = -ra -n 3