[pytest]
asyncio_mode = auto
# Session-scoped loops: the patchright driver belongs to the loop that started
# it, so a per-module loop forces a fresh Node driver (and its ~0.3 s spawn)
# for every module a worker touches. One loop per worker lets the driver —
# and its warm CDP connection — serve every browser the worker opens.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = ["tests/e2e"]
# addopts MUST stay unquoted: pytest shlex-splits a quoted value into a single
# argument, so `addopts = "-ra -n 4"` silently passes one bogus arg and xdist
# never starts a worker (the whole suite then runs in one process).
# Worker sweep on this 8-thread (4 physical core) box, 266 tests, desktop
# load 1.4-2.8, after the fastscan prefilter-widening fix removed the
# 252 s compile bomb (2026-11): -n 2 326 s (and the engine-cadence
# ceiling flaked at 0.1006 s vs 0.1), -n 3 269 s, -n 4 359-397 s — with
# cpu_seconds RISING 360 -> 429 from 3 to 4 workers. Concurrent Chrome
# fleets contend superlinearly: the whole wrap module runs sequentially
# in 19 s where its tests took 16-37 s each under -n 4, and ~3-4x their
# sequential wall under -n 3. 3 workers is the measured optimum, and
# ADR-0022's user-close race note still argues for the headroom 3 leaves.
# Override per invocation: `-n 0` sequential (also required for pdb — xdist
# breaks it), `-n N` more.
addopts = -ra -n 3