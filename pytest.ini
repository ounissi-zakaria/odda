[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = module
asyncio_default_test_loop_scope = module
testpaths = ["tests/e2e"]
# 4 xdist workers is the measured sweet spot (Chrome is CPU/memory heavy;
# beyond ~4 stops helping on an 8-core box). Override per invocation:
# `-n 0` sequential (also required for pdb — xdist breaks it), `-n N` more.
addopts = "-ra -n 4"