[project]
name = "odda"
version = "0.30.0"
description = "Browser automation and HTTP traffic capture CLI for AI agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15.0",
    "mitmproxy>=11.0.2",
    "patchright>=1.60",
    "h2>=4.0.0",
]

[project.scripts]
odda = "odda.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.15.11",
    "hypercorn>=0.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
odda = ["opencode/*.js", "opencode/*.md", "opencode/recipes/*.md", "userscripts/default/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
exclude = ["tests/e2e/*.sh"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "D",
    "S",
    "B",
    "C4",
    "UP",
    "SIM",
    "TCH",
    "PTH",
    "ERA",
    "RUF",
    "ARG",
    "PL",
    "PERF",
    "FURB",
    "TRY",
    "EM",
    "RET",
    "SLF",
    "TID",
    "RSE",
    "FBT",
    "COM",
    "C90",
    "INP",
    "PIE",
    "T20",
    "PGH",
    "FAST",
]
ignore = [
    "D100",
    "D104",
    "COM812",
    "ISC001",
    "T201",
    "EM101",
    "EM102",
    "TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 15
max-returns = 8
max-statements = 60
max-public-methods = 25

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["odda"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"src/odda/cli.py" = ["B008", "FBT001", "FBT003", "PLR0913"]
"src/odda/flowstore.py" = ["PLW0603", "PLR0913"]
"src/odda/server.py" = ["TRY301"]
"src/odda/request/*.py" = ["PLR0913", "PLR2004", "C901", "PLR0912", "PLR0915", "TC003"]
"src/odda/wrap.py" = ["E501"]
"src/odda/logpoint.py" = ["E501", "PLR0913"]
"src/odda/render.py" = ["D103", "PERF401", "E501"]
"tests/e2e/scrut/fixtures/dyn_asgi.py" = ["INP001", "ARG001"]
"tests/e2e/scrut/fixtures/ws_header_h2server.py" = ["INP001", "S110"]
"tests/e2e/scrut/fixtures/h2_cookie_client.py" = ["INP001"]
"tests/e2e/scrut/fixtures/slow_load_server.py" = ["INP001"]
